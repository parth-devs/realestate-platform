services:
  - type: web
    name: real-estate-intelligence-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt fastapi uvicorn
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
