<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Real Estate Intelligence Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #151d2f;
            --border: #243048;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-amber: #fbbf24;
            --accent-purple: #c084fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Navbar */
        nav {
            background: rgba(21, 29, 47, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 800; color: var(--accent-blue); }
        .api-badge {
            background: rgba(74, 222, 128, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(74, 222, 128, 0.3);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .api-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        .api-links { display: flex; gap: 12px; align-items: center; }
        .api-link-btn {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .api-link-btn:hover { background: var(--accent-blue); color: #0b0f19; }

        .container { max-width: 1440px; margin: 0 auto; padding: 28px 24px; flex: 1; width: 100%; }

        /* KPI Header Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
        .kpi-label { font-size: 0.82rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .kpi-val { font-size: 1.8rem; font-weight: 800; }

        /* Filters Bar */
        .filters-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
        }

        .search-box { flex: 1; min-width: 280px; }
        .search-input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }
        .search-input:focus { border-color: var(--accent-blue); }

        .select-filter {
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .pill {
            background: #0b0f19;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill.active { background: var(--accent-blue); color: #0b0f19; border-color: var(--accent-blue); }

        /* Property Cards Grid */
        .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .prop-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }
        .prop-card:hover { transform: translateY(-4px); border-color: var(--accent-blue); }

        .prop-badge-bar { padding: 14px 18px 0; display: flex; justify-content: space-between; align-items: center; }
        .tag { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .tag-zillow { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .tag-loopnet { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        .tag-parcels { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }

        .state-pill { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); background: rgba(255, 255, 255, 0.05); padding: 2px 6px; border-radius: 4px; }
        .prop-body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .prop-price { font-size: 1.45rem; font-weight: 800; color: var(--accent-green); }
        .prop-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; color: var(--text-main); }
        .prop-location { font-size: 0.82rem; color: var(--text-muted); }

        .specs-row {
            display: flex;
            gap: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 8px 0;
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .specs-item strong { color: var(--text-main); }

        .prop-footer { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; }
        .owner-desc { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .detail-btn {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .detail-btn:hover { background: var(--accent-blue); color: #0b0f19; }

        /* Detail Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            width: 90%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-table { width: 100%; margin-top: 16px; border-collapse: collapse; }
        .modal-table td { padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
        .modal-table td:first-child { color: var(--text-muted); width: 40%; font-weight: 500; }
        .modal-table td:last-child { color: var(--text-main); font-weight: 600; }
    </style>
</head>
<body>

    <nav>
        <div class="brand">
            <span>🏛️</span> US Real Estate Intelligence
            <div class="api-badge">
                <span class="api-dot"></span>
                <span>Powered by Custom REST API</span>
            </div>
        </div>
        <div class="api-links">
            <a href="/docs" target="_blank" class="api-link-btn">⚡ Our API Swagger Docs</a>
            <a href="/api/v1/properties" target="_blank" class="api-link-btn">Raw JSON Endpoint</a>
        </div>
    </nav>

    <div class="container">

        <!-- KPI Summary Cards -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <span class="kpi-label">Total Properties in Database</span>
                <span class="kpi-val" style="color: var(--accent-blue);" id="kpiTotal">726</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-label">Residential (Zillow API)</span>
                <span class="kpi-val" style="color: var(--accent-blue);" id="kpiZillow">534</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-label">Commercial (LoopNet API)</span>
                <span class="kpi-val" style="color: var(--accent-amber);" id="kpiLoopnet">52</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-label">Land & Parcels (LandGlide API)</span>
                <span class="kpi-val" style="color: var(--accent-green);" id="kpiParcels">130</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-label">US States Ingested</span>
                <span class="kpi-val" style="color: var(--accent-purple);" id="kpiStates">9 States</span>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="filters-panel">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by address, city, owner, APN via API..." oninput="triggerSearch()">
            </div>

            <div class="pill-group">
                <button class="pill active" onclick="setSource('all', this)">All Platforms</button>
                <button class="pill" onclick="setSource('zillow', this)">🏡 Zillow</button>
                <button class="pill" onclick="setSource('loopnet', this)">🏢 LoopNet</button>
                <button class="pill" onclick="setSource('us_parcels', this)">🗺️ LandGlide</button>
            </div>

            <select id="stateFilter" class="select-filter" onchange="triggerSearch()">
                <option value="all">All States (USA)</option>
                <option value="TX">Texas (TX)</option>
                <option value="NY">New York (NY)</option>
                <option value="CA">California (CA)</option>
                <option value="FL">Florida (FL)</option>
                <option value="IL">Illinois (IL)</option>
                <option value="GA">Georgia (GA)</option>
                <option value="CO">Colorado (CO)</option>
                <option value="AZ">Arizona (AZ)</option>
                <option value="WA">Washington (WA)</option>
            </select>
        </div>

        <!-- Property Grid Container -->
        <div class="property-grid" id="propertyGrid">
            <!-- Dynamically populated via our API -->
        </div>

    </div>

    <!-- Property Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle" style="font-size: 1.35rem; margin-bottom: 6px;">Property Details</h2>
            <div id="modalPrice" style="font-size: 1.6rem; font-weight: 800; color: var(--accent-green); margin-bottom: 16px;"></div>
            <table class="modal-table" id="modalTable">
                <!-- Dynamically populated -->
            </table>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin.includes('localhost') && !window.location.port.includes('8080')
            ? 'http://localhost:8080/api/v1'
            : (window.location.origin.startsWith('http') ? window.location.origin + '/api/v1' : 'http://localhost:8080/api/v1');
        let activeSource = 'all';
        let currentProperties = [];

        function formatCurrency(val) {
            if (!val) return 'Contact Broker';
            return '$' + Number(val).toLocaleString();
        }

        async function fetchFromOurAPI() {
            const search = document.getElementById('searchInput').value;
            const state = document.getElementById('stateFilter').value;

            let url = `${API_BASE}/properties?limit=100`;
            if (search) url += `&search=${encodeURIComponent(search)}`;
            if (state !== 'all') url += `&state=${encodeURIComponent(state)}`;
            if (activeSource !== 'all') {
                const s = activeSource === 'us_parcels' ? 'us_parcels' : activeSource;
                url += `&source=${encodeURIComponent(s)}`;
            }

            try {
                const resp = await fetch(url);
                if (resp.ok) {
                    const data = await resp.json();
                    currentProperties = data.results;
                    renderCards(currentProperties);
                    return;
                }
            } catch (err) {
                console.log("Custom API server offline or loading fallback data...");
            }

            // Fallback load if API server is booting
            renderFallback();
        }

        function setSource(source, element) {
            activeSource = source;
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            fetchFromOurAPI();
        }

        function triggerSearch() {
            fetchFromOurAPI();
        }

        function renderCards(items) {
            const grid = document.getElementById('propertyGrid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted); font-size: 1.1rem;">No properties found matching your filter criteria.</div>';
                return;
            }

            items.forEach(p => {
                const card = document.createElement('div');
                card.className = 'prop-card';

                const sourceTagClass = p.source === 'zillow' ? 'tag-zillow' : p.source === 'loopnet' ? 'tag-loopnet' : 'tag-parcels';
                const sourceLabel = p.source === 'zillow' ? 'Zillow' : p.source === 'loopnet' ? 'LoopNet' : 'LandGlide';

                let priceDisplay = p.price ? formatCurrency(p.price) : (p.lease_rate ? p.lease_rate : (p.tax_assessed_value ? 'Assessed: ' + formatCurrency(p.tax_assessed_value) : 'Off-Market'));

                let specsHtml = '';
                if (p.source === 'zillow') {
                    specsHtml = `
                        <div class="specs-item"><strong>${p.beds || '-'}</strong> Beds</div>
                        <div class="specs-item"><strong>${p.baths || '-'}</strong> Baths</div>
                        <div class="specs-item"><strong>${p.sqft ? p.sqft.toLocaleString() : '-'}</strong> SqFt</div>
                    `;
                } else if (p.source === 'loopnet') {
                    specsHtml = `
                        <div class="specs-item"><strong>${p.property_type || 'Commercial'}</strong></div>
                        <div class="specs-item"><strong>${p.sqft ? p.sqft.toLocaleString() + ' SF' : (p.lot_size_acres ? p.lot_size_acres + ' AC' : '-')}</strong></div>
                    `;
                } else {
                    specsHtml = `
                        <div class="specs-item"><strong>${p.lot_size_acres || '1.0'}</strong> Acres</div>
                        <div class="specs-item"><strong>APN:</strong> ${p.parcel_id || p.external_id}</div>
                    `;
                }

                card.innerHTML = `
                    <div class="prop-badge-bar">
                        <span class="tag ${sourceTagClass}">${sourceLabel}</span>
                        <span class="state-pill">${p.state || 'US'}</span>
                    </div>
                    <div class="prop-body">
                        <div class="prop-price">${priceDisplay}</div>
                        <div class="prop-title">${p.title || p.address || 'Real Estate Asset'}</div>
                        <div class="prop-location">📍 ${p.city || ''}, ${p.state || ''} ${p.zip_code || ''}</div>
                        <div class="specs-row">
                            ${specsHtml}
                        </div>
                        <div class="prop-footer">
                            <span class="owner-desc">${p.owner_name ? '👤 ' + p.owner_name : (p.broker_name ? '🏢 ' + p.broker_name : '')}</span>
                            <button class="detail-btn" onclick="openDetail(${p.id})">Details & API Data →</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openDetail(id) {
            const p = currentProperties.find(x => x.id === id);
            if (!p) return;

            document.getElementById('modalTitle').innerText = p.title || p.address || 'Real Estate Asset Details';
            document.getElementById('modalPrice').innerText = p.price ? formatCurrency(p.price) : (p.lease_rate || 'Contact Broker');

            const table = document.getElementById('modalTable');
            table.innerHTML = `
                <tr><td>Source Platform</td><td>${p.source.toUpperCase()}</td></tr>
                <tr><td>Asset External ID</td><td>${p.external_id}</td></tr>
                <tr><td>Property Type</td><td>${p.property_type || 'Residential'}</td></tr>
                <tr><td>Listing Status</td><td>${p.listing_status || 'Active'}</td></tr>
                <tr><td>Street Address</td><td>${p.address || '-'}</td></tr>
                <tr><td>City, State ZIP</td><td>${p.city || '-'}, ${p.state || '-'} ${p.zip_code || ''}</td></tr>
                <tr><td>Bedrooms / Bathrooms</td><td>${p.beds || '-'} Beds / ${p.baths || '-'} Baths</td></tr>
                <tr><td>Square Footage</td><td>${p.sqft ? p.sqft.toLocaleString() + ' SqFt' : '-'}</td></tr>
                <tr><td>Lot Size (Acres)</td><td>${p.lot_size_acres ? p.lot_size_acres + ' Acres' : '-'}</td></tr>
                <tr><td>County Tax Value</td><td>${p.tax_assessed_value ? formatCurrency(p.tax_assessed_value) : '-'}</td></tr>
                <tr><td>Registered Owner</td><td>${p.owner_name || 'N/A'}</td></tr>
                <tr><td>Listing Broker / Agent</td><td>${p.broker_name || 'N/A'}</td></tr>
                <tr><td>Custom API Endpoint</td><td><a href="${API_BASE}/properties/${p.id}" target="_blank" style="color: var(--accent-blue);">/api/v1/properties/${p.id}</a></td></tr>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Initial Load
        fetchFromOurAPI();
    </script>
</body>
</html>
