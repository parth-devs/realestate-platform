<!DOCTYPE html>
<html>
<head>
<style>
  @page { size: letter; margin: 0; }
  body { margin: 0; padding: 0; font-family: sans-serif; background: #f0f0f0; }
  .page { width: 8.5in; height: 11in; padding: 0.8in; margin: 0 auto 20px auto; background: white; box-sizing: border-box; page-break-after: always; position: relative; }
  @media print {
    body { background: white; }
    .page { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="page" id="page-1">
    <h1>Page 1: Title</h1>
    <p>This is the first page content.</p>
  </div>
  <div class="page" id="page-2">
    <h1>Page 2: Executive Summary</h1>
    <p>This is the second page content.</p>
  </div>
</body>
</html>
